# Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/student_app_db
spring.datasource.username=postgres
spring.datasource.password=Rohit@2031
spring.datasource.driver-class-name=org.postgresql.Driver
 spring.jpa.properties.hibernate.default_schema=student_app

# HikariCP settings
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
# 10 min
spring.datasource.hikari.idle-timeout=600000 
  # 30 min
spring.datasource.hikari.max-lifetime=1800000   
   # 30 sec
spring.datasource.hikari.connection-timeout=30000 
# 5 sec
spring.datasource.hikari.validation-timeout=5000   
# 5 min
spring.datasource.hikari.keepalive-time=300000     
# 20 sec (optional)
spring.datasource.hikari.leak-detection-threshold=20000  

# Validate connections automatically
spring.datasource.hikari.connection-test-query=SELECT 1

server.port=8080

server.error.include-stacktrace=never
server.error.include-message=always

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
# Options: validate, update, create, create-drop
spring.jpa.show-sql=true
